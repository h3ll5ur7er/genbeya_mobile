# Checks every push: format, analysis and tests on Linux, then an Android build on
# Linux and an iOS build without signing on macOS. See docs/Development.md.
name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust targets for the Git core (GM-2)
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: genbeya-mobile-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust targets for the Git core (GM-2)
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - run: flutter build ios --debug --no-codesign

  rust:
    # The Git core (native/genbeya_core): its flow tests, then the same library
    # driven from Dart through the generated bridge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flow tests
        working-directory: native/genbeya_core
        run: cargo test
      - name: Build the library for this machine
        working-directory: native/genbeya_core
        run: cargo build --release --lib
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: The bridge, end to end
        run: flutter test test/native_bridge_test.dart
