# Checks every push: format, analysis and tests on Linux, then an Android build on
# Linux and an iOS build without signing on macOS. See docs/Development.md.
name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  conformance:
    # The expected outputs must be what Genbeya, at the commit in kit/GENBEYA_REF,
    # produces for the cases; the Dart side is checked by `flutter test` above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Genbeya commit
        id: ref
        run: echo "sha=$(cat kit/GENBEYA_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: genbeya/genbeya
          ref: ${{ steps.ref.outputs.sha }}
          path: .genbeya
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the expected outputs
        working-directory: tool/conformance
        run: |
          npm ci
          GENBEYA_SRC="$GITHUB_WORKSPACE/.genbeya" node generate.mjs
      - name: They match what is committed
        run: git diff --exit-code tool/conformance/expected

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: genbeya-mobile-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --debug --no-codesign
