# Checks every push: format, analysis and tests on Linux, then an Android build on
# Linux and an iOS build without signing on macOS. See docs/Development.md.
name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The collation table is ICU's (tool/conformance/make-collation.mjs)
        run: |
          (cd tool/conformance && node make-collation.mjs)
          dart format lib/engines/collation_table.dart
          git diff --exit-code lib/engines/collation_table.dart

  conformance:
    # The expected outputs must be what Genbeya, at the commit in kit/GENBEYA_REF,
    # produces for the cases; the Dart side is checked by `flutter test` above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Genbeya commit
        id: ref
        run: echo "sha=$(cat kit/GENBEYA_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: genbeya/genbeya
          ref: ${{ steps.ref.outputs.sha }}
          path: .genbeya
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the expected outputs
        working-directory: tool/conformance
        run: |
          npm ci
          GENBEYA_SRC="$GITHUB_WORKSPACE/.genbeya" node generate.mjs
      - name: They match what is committed
        run: git diff --exit-code tool/conformance/expected

  kit:
    # Puts Genbeya's released kit (kit/GENBEYA_KIT) into kit/dist, checked
    # against its manifest, and checks it in Chromium (tool/build_kit/test.mjs).
    # See kit/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: tool/build_kit/.cache
          key: kit-genbeya-${{ runner.os }}-${{ hashFiles('kit/GENBEYA_KIT', 'kit/GENBEYA_REF') }}
      - name: Build the kit
        working-directory: tool/build_kit
        run: node build.mjs
      - name: Test the kit in Chromium
        working-directory: tool/build_kit
        run: |
          npm install --global playwright@1.63.0
          npx playwright install --with-deps chromium
          node test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kit
          path: kit/dist

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: tool/build_kit/.cache
          key: kit-genbeya-${{ runner.os }}-${{ hashFiles('kit/GENBEYA_KIT', 'kit/GENBEYA_REF') }}
      - name: Build the kit
        run: node tool/build_kit/build.mjs
      - name: Rust targets for the Git core (GM-2)
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      # OAuth apps for signing in (GM-6): repository variables, empty when unset.
      - run: flutter build apk --debug --dart-define=GENBEYA_GITHUB_CLIENT_ID=${{ vars.GENBEYA_GITHUB_CLIENT_ID }} --dart-define=GENBEYA_GITLAB_CLIENT_ID=${{ vars.GENBEYA_GITLAB_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: genbeya-mobile-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: tool/build_kit/.cache
          key: kit-genbeya-${{ runner.os }}-${{ hashFiles('kit/GENBEYA_KIT', 'kit/GENBEYA_REF') }}
      - name: Build the kit
        run: node tool/build_kit/build.mjs
      - name: Rust targets for the Git core (GM-2)
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - run: flutter build ios --debug --no-codesign --dart-define=GENBEYA_GITHUB_CLIENT_ID=${{ vars.GENBEYA_GITHUB_CLIENT_ID }} --dart-define=GENBEYA_GITLAB_CLIENT_ID=${{ vars.GENBEYA_GITLAB_CLIENT_ID }}

  rust:
    # The Git core (native/genbeya_core): its flow tests, then the same library
    # driven from Dart through the generated bridge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: An SSH server for the SSH flow test
        run: |
          sudo apt-get install -y -q openssh-server
          sudo mkdir -p /run/sshd
      - name: Flow tests
        working-directory: native/genbeya_core
        run: cargo test
      - name: Build the library for this machine
        working-directory: native/genbeya_core
        run: cargo build --release --lib
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: The bridge, end to end
        run: flutter test test/native_bridge_test.dart test/sync_flow_test.dart test/desktop_layout_test.dart
