[package]
name = "genbeya_core"
version = "0.1.0"
edition = "2021"
description = "Genbeya Mobile's Git core: task-shaped operations over libgit2, bound to Dart with flutter_rust_bridge"
license = "FSL-1.1-ALv2"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https", "ssh"] }
flutter_rust_bridge = "=2.13.0"
# To add CA certificates from memory (add_ca_certificates); the same versions git2 uses.
libgit2-sys = "=0.18.8"
openssl-sys = "=0.9.118"
libc = "0.2"
# Ed25519 keys made on the device for SSH, in OpenSSH's format.
ssh-key = { version = "=0.6.7", default-features = false, features = ["ed25519", "rand_core", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Full-text search over the clone's objects, as `git grep` does on a working tree.
regex = "1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[lints.rust]
# flutter_rust_bridge's attribute macros check this cfg.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
